# CI del frontend: corre en cada push y en cada Pull Request.
# Si algun paso falla, el commit/PR queda marcado en rojo en GitHub.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Si se sube un commit nuevo a la misma rama, se cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Atrapa restos de conflictos de merge (<<<<<<<, =======, >>>>>>>) en cualquier archivo,
      # incluso en los que ningun test ejecuta (ej.: Dockerfile).
      - name: Sin marcadores de conflicto
        run: |
          if git grep -n -I -E '^(<<<<<<<|=======|>>>>>>>)(\s|$)' -- . ':!*.md'; then
            echo "::error::Quedaron marcadores de conflicto de merge (ver lineas arriba)"
            exit 1
          fi

      # Misma version de Node que la imagen de produccion (node:24-alpine).
      # Vitest 5 y jsdom 30 exigen Node 22 o superior; Node 20 ya no tiene soporte.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Chequeo de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Build de produccion (Next.js)
        run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Solo verifica que la imagen de produccion se construya; no la publica en ningun lado.
      - name: Construir imagen
        run: docker build -t atlasgym-front:ci .
